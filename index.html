    <script>
        (function () {
            try {
                var saved = localStorage.getItem('cbSimTheme');
                var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
                document.documentElement.setAttribute('data-theme', saved || (prefersLight ? 'light' : 'dark'));
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();

            gap: 1rem;
            flex: 1;

        .tech-frame {

                linear-gradient(var(--accent-1), var(--accent-1)), linear-gradient(var(--accent-1), var(--accent-1)),

            background-size: 14px 2px, 2px 14px, 14px 2px, 2px 14px, 14px 2px, 2px 14px, 14px 2px, 2px 14px;
            background-position: top right, top right, top left, top left, bottom right, bottom right, bottom left, bottom left;
            background-repeat: no-repeat;
            background-origin: border-box;
            opacity: 1;
        }

        .image-box {
            position: relative;
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 1rem;
            transition: all 0.3s ease;
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .image-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--shadow-color);
        }

        .image-box h3 {
            margin-bottom: 0.5rem;
            color: var(--accent-2);
            font-size: 1.1rem;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 16px var(--shadow-color);
        }

        .spinner {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--spinner-overlay);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .spinner-circle {
            width: 32px;
            height: 32px;
            border: 3px solid var(--panel-border);
            border-top-color: var(--accent-1);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .compare-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
        }

        .compare-box {
            background: var(--panel-bg);

            color: var(--accent-2);

            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .compare-box canvas {
            width: 100%;
            border-radius: 6px;
        }

        footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            padding: 0.5rem 0;
        }

        @media (max-width: 768px) {
            body {
                padding: 0.5rem;

            header {
                padding: 0.25rem 2.75rem;
            }

            .controls {
                padding: 0.75rem;
                gap: 0.75rem;

            .file-input-label {
                padding: 6px 12px;
                font-size: 0.85rem;

            .image-container {
                gap: 0.75rem;

            .image-box {
                padding: 0.75rem;
            }

            .dropzone {
                padding: 2rem 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>

    <script>
        const originalCanvas = document.getElementById('originalCanvas');
        const filteredCanvas = document.getElementById('filteredCanvas');

        // ---------------------------------------------------------------
        // Theme (dark / light, persisted)
        // ---------------------------------------------------------------

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            try { localStorage.setItem('cbSimTheme', theme); } catch (e) { /* storage unavailable */ }
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
            themeToggle.setAttribute('aria-label', theme === 'dark' ? 'עבור למצב תצוגה בהיר' : 'עבור למצב תצוגה כהה');

        setTheme(document.documentElement.getAttribute('data-theme') || 'dark');
        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        // ---------------------------------------------------------------
        // Color science: physiologically-based CVD simulation
        // (Brettel, Viénot & Mollon 1997 two-plane LMS projection model,
        // applied in linear-light sRGB space with correct gamma handling)
        // ---------------------------------------------------------------

        const BRETTEL_PARAMS = {
            protanopia: {
                m1: [0.14980, 1.19548, -0.34528, 0.10764, 0.84864, 0.04372, 0.00384, -0.00540, 1.00156],
                m2: [0.14570, 1.16172, -0.30742, 0.10816, 0.85291, 0.03892, 0.00386, -0.00524, 1.00139],
                n: [0.00048, 0.00393, -0.00441]
            },
            deuteranopia: {
                m1: [0.36477, 0.86381, -0.22858, 0.26294, 0.64245, 0.09462, -0.02006, 0.02728, 0.99278],
                m2: [0.37298, 0.88166, -0.25464, 0.25954, 0.63506, 0.10540, -0.01980, 0.02784, 0.99196],
                n: [-0.00281, -0.00611, 0.00892]
            },
            tritanopia: {
                m1: [1.01277, 0.13548, -0.14826, -0.01243, 0.86812, 0.14431, 0.07589, 0.80500, 0.11911],
                m2: [0.93678, 0.18979, -0.12657, 0.06154, 0.81526, 0.12320, -0.37562, 1.12767, 0.24796],
                n: [0.03901, -0.02788, -0.01113]
            }
        };

        // Rec. 709 relative luminance, used for achromatopsia (monochromacy).
        const LUMINANCE_WEIGHTS = [0.2126, 0.7152, 0.0722];

        // 8-bit sRGB -> linear-light lookup table.
        const SRGB_TO_LINEAR = new Float32Array(256);
        for (let i = 0; i < 256; i++) {
            const c = i / 255;
            SRGB_TO_LINEAR[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        }

        // Linear-light -> 8-bit sRGB lookup table (12-bit resolution, plenty for 8-bit output).
        const LINEAR_TO_SRGB_STEPS = 4096;
        const LINEAR_TO_SRGB = new Uint8ClampedArray(LINEAR_TO_SRGB_STEPS);
        for (let i = 0; i < LINEAR_TO_SRGB_STEPS; i++) {
            const c = i / (LINEAR_TO_SRGB_STEPS - 1);
            const s = c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
            LINEAR_TO_SRGB[i] = Math.round(Math.min(1, Math.max(0, s)) * 255);
        }
        function linearToSrgbByte(c) {
            const idx = Math.round(Math.min(1, Math.max(0, c)) * (LINEAR_TO_SRGB_STEPS - 1));
            return LINEAR_TO_SRGB[idx];
        }

        /**
         * Applies a color vision deficiency filter directly to ImageData in place.
         * `type` is 'normal' | 'protanopia' | 'deuteranopia' | 'tritanopia' | 'achromatopsia'.
         * `severityPercent` (0-100) blends between unaffected and fully-affected vision,
         * matching how anomalous trichromacy (e.g. protanomaly) sits between normal
         * vision and full dichromacy.
         */
        function applyColorBlindFilter(imageData, type, severityPercent) {
            if (type === 'normal' || severityPercent <= 0) return imageData;
            const severity = Math.min(100, severityPercent) / 100;
            const data = imageData.data;
            const brettel = BRETTEL_PARAMS[type];

            for (let i = 0; i < data.length; i += 4) {
                const r = SRGB_TO_LINEAR[data[i]];
                const g = SRGB_TO_LINEAR[data[i + 1]];
                const b = SRGB_TO_LINEAR[data[i + 2]];

                let simR, simG, simB;
                if (type === 'achromatopsia') {
                    const y = r * LUMINANCE_WEIGHTS[0] + g * LUMINANCE_WEIGHTS[1] + b * LUMINANCE_WEIGHTS[2];
                    simR = simG = simB = y;
                } else {
                    const dot = r * brettel.n[0] + g * brettel.n[1] + b * brettel.n[2];
                    const m = dot >= 0 ? brettel.m1 : brettel.m2;
                    simR = r * m[0] + g * m[1] + b * m[2];
                    simG = r * m[3] + g * m[4] + b * m[5];
                    simB = r * m[6] + g * m[7] + b * m[8];
                }

                data[i] = linearToSrgbByte(simR * severity + r * (1 - severity));
                data[i + 1] = linearToSrgbByte(simG * severity + g * (1 - severity));
                data[i + 2] = linearToSrgbByte(simB * severity + b * (1 - severity));
            }
            return imageData;
        }

        // ---------------------------------------------------------------
        // UI wiring
        // ---------------------------------------------------------------

        const DEFICIENCY_TYPES = [
            { key: 'protanopia', label: 'פרוטנופיה' },
            { key: 'deuteranopia', label: 'דאוטרנופיה' },
            { key: 'tritanopia', label: 'טריטנופיה' },
            { key: 'achromatopsia', label: 'אכרומטופסיה' }
        ];

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.hidden = false;
            clearTimeout(errorTimeoutId);
            errorTimeoutId = setTimeout(() => { errorMessage.hidden = true; }, 4000);
        }

        function showSpinner(visible) {
            spinner.hidden = !visible;
        }

        function loadImageFile(file) {
            if (!file || !file.type || !file.type.startsWith('image/')) {
                showError('אנא בחרו קובץ תמונה תקין (JPG, PNG, GIF וכדומה)');
                return;
            }
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    currentFileName = file.name || 'image';
                    onImageLoaded();
                };
                img.onerror = () => showError('לא ניתן היה לטעון את התמונה');
                img.src = event.target.result;
            };
            reader.onerror = () => showError('לא ניתן היה לקרוא את הקובץ');
            reader.readAsDataURL(file);
        }

        function onImageLoaded() {
            dropzone.hidden = true;
            imageContainer.hidden = false;
            downloadBtn.disabled = false;
            resetBtn.disabled = false;
            fileInfo.hidden = false;
            fileInfo.textContent = `${currentFileName} — ${originalImage.width}×${originalImage.height} פיקסלים`;
            processImage();
        }

        function processImage() {
            if (!originalImage) return;
            showSpinner(true);
            setTimeout(() => {
                originalCanvas.width = originalImage.width;
                originalCanvas.height = originalImage.height;
                originalCanvas.getContext('2d').drawImage(originalImage, 0, 0);

                filteredCanvas.width = originalImage.width;
                filteredCanvas.height = originalImage.height;
                const ctx = filteredCanvas.getContext('2d');
                ctx.drawImage(originalImage, 0, 0);

                const imageData = ctx.getImageData(0, 0, filteredCanvas.width, filteredCanvas.height);
                applyColorBlindFilter(imageData, colorBlindType.value, Number(severitySlider.value));
                ctx.putImageData(imageData, 0, 0);

                updateCompareGrid();
                showSpinner(false);
            }, 10);
        }

        function updateCompareGrid() {
            if (!compareAllToggle.checked || !originalImage) {
                compareGrid.hidden = true;
                return;
            }
            compareGrid.hidden = false;
            compareGrid.innerHTML = '';

            const maxDim = 260;
            const scale = Math.min(1, maxDim / Math.max(originalImage.width, originalImage.height));
            const w = Math.max(1, Math.round(originalImage.width * scale));
            const h = Math.max(1, Math.round(originalImage.height * scale));
            const severity = Number(severitySlider.value);

            DEFICIENCY_TYPES.forEach(({ key, label }) => {
                const box = document.createElement('div');
                box.className = 'compare-box';

                const heading = document.createElement('h4');
                heading.textContent = label;

                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(originalImage, 0, 0, w, h);
                const imageData = ctx.getImageData(0, 0, w, h);
                applyColorBlindFilter(imageData, key, severity);
                ctx.putImageData(imageData, 0, 0);

                box.appendChild(heading);
                box.appendChild(canvas);
                compareGrid.appendChild(box);
            });
        }

        function resetAll() {
            originalImage = null;
            currentFileName = '';
            imageInput.value = '';
            imageContainer.hidden = true;
            compareGrid.hidden = true;
            dropzone.hidden = false;
            downloadBtn.disabled = true;
            resetBtn.disabled = true;
            fileInfo.hidden = true;
            originalCanvas.getContext('2d').clearRect(0, 0, originalCanvas.width, originalCanvas.height);
            filteredCanvas.getContext('2d').clearRect(0, 0, filteredCanvas.width, filteredCanvas.height);
        }

        // File selection
        imageInput.addEventListener('change', (e) => loadImageFile(e.target.files[0]));

        // Drag & drop
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => e.preventDefault());

        ['dragenter', 'dragover'].forEach((evt) => {
            dropzone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            });
        });
        ['dragleave', 'drop'].forEach((evt) => {
            dropzone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
            });
        });
        dropzone.addEventListener('drop', (e) => {
            const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if (file) loadImageFile(file);
        });
        dropzone.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                imageInput.click();
            }
        });

        // Paste from clipboard
        window.addEventListener('paste', (e) => {
            const items = e.clipboardData && e.clipboardData.items;
            if (!items) return;
            const item = Array.from(items).find((i) => i.type && i.type.startsWith('image/'));
            if (item) loadImageFile(item.getAsFile());
        });

        // Controls
        colorBlindType.addEventListener('change', processImage);

        let severityRafId = null;
        severitySlider.addEventListener('input', (e) => {
            severityValue.textContent = `${e.target.value}%`;
            if (severityRafId) cancelAnimationFrame(severityRafId);
            severityRafId = requestAnimationFrame(processImage);
        });

        compareAllToggle.addEventListener('change', updateCompareGrid);

        downloadBtn.addEventListener('click', () => {
            filteredCanvas.toBlob((blob) => {
                if (!blob) return;
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `filtered-${colorBlindType.value}-${currentFileName || 'image'}.png`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            });
        });

        resetBtn.addEventListener('click', resetAll);
    </script>
</body>
</html>
